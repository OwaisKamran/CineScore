# CineScore Streamlit theme. Colours and fonts match app/static/tokens.css (shared with Flask).
# primaryColor is ink, so checkboxes and focus rings are black; the green accent is applied by
# streamlit.css only to the rating, the driver bars and the Predict button, as in the Flask app.
[theme]
base = "light"
primaryColor = "#111111"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#ffffff"
textColor = "#111111"
borderColor = "#8d8d8a"
linkColor = "#1f4d3a"
redColor = "#9b1c1c"
font = "Libre Franklin:https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600&display=swap, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap, serif"
headingFontWeights = 600
baseFontSize = 15
baseRadius = "0px"
buttonRadius = "0px"
showWidgetBorder = true

[client]
toolbarMode = "viewer"
showErrorDetails = "none"

[browser]
gatherUsageStats = false
