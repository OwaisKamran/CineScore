<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineScore</title>
  <meta name="description" content="Forecast a film's IMDb rating before it is released.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.css">
  <style>
    html, body { margin: 0; background: #ffffff; }
    #boot { font: 15px/1.5 "Segoe UI", Helvetica, Arial, sans-serif; color: #4a4a48; max-width: 640px;
      margin: 18vh auto 0; padding: 0 16px; }
    #boot strong { display: block; font: 600 32px/1.1 Georgia, serif; color: #111; margin-bottom: 8px; }
  </style>
</head>
<body>
  <!-- CineScore Streamlit app running fully in the browser with stlite (Streamlit on Pyodide).
       Generated by scripts/06_publish_huggingface.py: FILES and CONFIG are filled in at build time. -->
  <div id="root"><div id="boot"><strong>CineScore</strong>Loading the app and the model in your browser.
    The first visit takes about 20 to 40 seconds.</div></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.js";
    const FILES = /*FILES*/[];
    const CONFIG = /*CONFIG*/{};
    const files = Object.fromEntries(FILES.map(p => [p, { url: "./" + p }]));
    mount({
      // scikit-learn 1.8.0, pandas 3.0.2, numpy 2.4.3 and joblib 1.5.3 come with Pyodide 314
      // (streamlit-searchbox is not used in the browser; the app switches to built-in widgets there)
      requirements: ["scikit-learn", "pandas", "numpy", "joblib"],
      entrypoint: "streamlit_app/streamlit_app.py",
      files,
      streamlitConfig: CONFIG,
    }, document.getElementById("root"));
  </script>
</body>
</html>
